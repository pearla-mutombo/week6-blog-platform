name: CI

on:
  push:
    branches:
      - main
      - feature/blog-platform
  pull_request:
    branches:
      - main

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript lint
        run: npm run lint

      - name: Run SCSS lint
        run: npm run lint:scss

      - name: Run HTML lint
        run: npm run lint:html

      - name: Run tests
        run: npm run test

      - name: Build production app
        run: npm run build
